services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tzbot
      POSTGRES_PASSWORD: tzbot
      POSTGRES_DB: tzbot
    volumes:
      - tzbot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tzbot:tzbot@db:5432/tzbot?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  tzbot_db_data:
